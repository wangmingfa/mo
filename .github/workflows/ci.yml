# Mo 的质量门禁 CI：每次 push / PR 都跑 fmt + check + clippy + test。
#
# 只在 macOS 上跑：Mo 是 macOS 优先的 GPUI 应用，mo-ui 依赖 gpui-kit 的
# macOS 平台层（含 third_party/block 的本地补丁）；Linux 侧未验证，暂不进矩阵。
#
# lint 策略在 [workspace.lints]（clippy all = deny）里，clippy 步骤再加
# `-D warnings` 双保险——rustc 自身的告警也一并不放行。

name: Rust CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust toolchain（stable + rustfmt + clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: 编译检查
        run: cargo check --all-targets --all-features

      - name: Clippy（告警即失败）
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 测试
        run: cargo test --all-features
