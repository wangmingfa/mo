[workspace]
resolver = "2"
members = [
    "crates/mo-core",
    "crates/mo-fs",
    "crates/mo-operations",
    "crates/mo-cache",
    "crates/mo-config",
    "crates/mo-thumbnails",
    "crates/mo-search",
    "crates/mo-preview",
    "crates/mo-diff",
    "crates/mo-app",
    "crates/mo-ui",
    "crates/mo-bench",
]

# 质量门禁（各 crate 通过 `[lints] workspace = true` 继承）。
# clippy 全部按 error 处理，防止告警累积；unsafe 仅 mo-ui 的 macOS
# FFI 层（icon.rs）使用，保持 warn 以便审查每一处。
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "deny"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Mo Contributors"]
rust-version = "1.98.1"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem
notify = "7"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# 哈希（校验和）
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

# IDs / utils
uuid = { version = "1", features = ["v4", "v7", "serde"] }
smallvec = "1"
parking_lot = "0.12"
# 用户目录（缓存 / 配置存放位置），跨平台
dirs = "5"

# 缩略图解码
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "ico",
] }

# 基准测试（仅 dev-dependencies 使用）
criterion = "0.5"

# UI (single facade for GPUI + base + component + assets)
gpui-kit = "0.6"

# Internal crates
mo-core = { path = "crates/mo-core" }
mo-fs = { path = "crates/mo-fs" }
mo-operations = { path = "crates/mo-operations" }
mo-cache = { path = "crates/mo-cache" }
mo-config = { path = "crates/mo-config" }
mo-thumbnails = { path = "crates/mo-thumbnails" }
mo-search = { path = "crates/mo-search" }
mo-preview = { path = "crates/mo-preview" }
mo-diff = { path = "crates/mo-diff" }
mo-app = { path = "crates/mo-app" }

[profile.release]
opt-level = 3
lto = "thin"

# 本地补丁：block 0.1.6 上游（SSheldon/rust-block）已停止维护，其 extern static
# 使用了空枚举类型（uninhabited static，rust-lang/rust#74840），将来会成为硬错误。
# third_party/block 修复了该写法（符号地址语义不变），替换全部传递依赖（cocoa → gpui）。
[patch.crates-io]
block = { path = "third_party/block" }
