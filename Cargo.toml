[workspace]
resolver = "2"
members = [
    "crates/mo-core",
    "crates/mo-fs",
    "crates/mo-operations",
    "crates/mo-cache",
    "crates/mo-config",
    "crates/mo-thumbnails",
    "crates/mo-search",
    "crates/mo-preview",
    "crates/mo-diff",
    "crates/mo-app",
    "crates/mo-ui",
    "crates/mo-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Mo Contributors"]
rust-version = "1.80"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Filesystem
notify = "7"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# 哈希（校验和）
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

# IDs / utils
uuid = { version = "1", features = ["v4", "v7", "serde"] }
smallvec = "1"
parking_lot = "0.12"
# 用户目录（缓存 / 配置存放位置），跨平台
dirs = "5"

# 缩略图解码
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "ico",
] }

# 基准测试（仅 dev-dependencies 使用）
criterion = "0.5"

# UI (single facade for GPUI + base + component + assets)
gpui-kit = "0.6"

# Internal crates
mo-core = { path = "crates/mo-core" }
mo-fs = { path = "crates/mo-fs" }
mo-operations = { path = "crates/mo-operations" }
mo-cache = { path = "crates/mo-cache" }
mo-config = { path = "crates/mo-config" }
mo-thumbnails = { path = "crates/mo-thumbnails" }
mo-search = { path = "crates/mo-search" }
mo-preview = { path = "crates/mo-preview" }
mo-diff = { path = "crates/mo-diff" }
mo-app = { path = "crates/mo-app" }

[profile.release]
opt-level = 3
lto = "thin"
