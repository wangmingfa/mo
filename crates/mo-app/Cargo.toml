[package]
name = "mo-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mo-core.workspace = true
mo-fs.workspace = true
mo-operations.workspace = true
mo-cache.workspace = true
mo-config.workspace = true
mo-thumbnails.workspace = true
mo-search.workspace = true
mo-preview.workspace = true
mo-diff.workspace = true
mo-remote.workspace = true
parking_lot.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
dirs.workspace = true
keyring.workspace = true

# Windows shell 集成（默认打开 / 打开方式）：ShellExecute 系列 FFI + 注册表枚举。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }
winreg = "0.55"

[dev-dependencies]
# 测试里的「假远程后端」要实现 `mo_fs::FileSystem`（该 trait 用 async_trait 宏），
# 用于验证「本地位置在远程会话下必须走 open_local」，见 tests/remote_local.rs。
async-trait.workspace = true

[lints]
workspace = true
