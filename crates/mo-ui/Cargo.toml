[package]
name = "mo-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mo"
path = "src/main.rs"

[dependencies]
mo-core.workspace = true
mo-fs.workspace = true
mo-app.workspace = true
mo-operations.workspace = true
mo-search.workspace = true
mo-preview.workspace = true
mo-diff.workspace = true
gpui-kit.workspace = true
tokio.workspace = true
tracing.workspace = true

# 运行时设置 macOS Dock 图标（objc 已在依赖树中：cocoa → objc，不引入新外部代码）。
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

# objc 0.2 的 class!/msg_send! 宏内部含 `cfg(feature = "cargo-clippy")`，
# 宏展开到本 crate 时会触发 unexpected_cfgs 告警；这里声明该值为已知，消除误报。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
# `test-support` 打开 GPUI 的 headless 测试通道（TestAppContext / debug_bounds）：
# 不依赖真实窗口即可验证布局，见 tests/layout.rs。
gpui-kit = { workspace = true, features = ["test-support"] }
