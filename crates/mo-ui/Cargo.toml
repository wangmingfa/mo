[package]
name = "mo-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mo"
path = "src/main.rs"

[dependencies]
mo-core.workspace = true
mo-fs.workspace = true
mo-app.workspace = true
mo-operations.workspace = true
mo-search.workspace = true
mo-preview.workspace = true
mo-diff.workspace = true
mo-platform.workspace = true
gpui-kit.workspace = true
# 内存位图（BGRA）→ `image::Frame` / `RenderImage` 的包装（`src/bitmap.rs`）。
image.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# 运行时设置 macOS Dock 图标（objc 已在依赖树中：cocoa → objc，不引入新外部代码）。
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

# 构建期把 assets/icon.png 编成 ID=1 图标资源内嵌进 mo.exe（修 Windows 任务栏图标）。
# 仅 Windows 需要；image 复用 workspace 配置（含 png 解码 + ico 编码 feature）。
[target.'cfg(windows)'.build-dependencies]
image.workspace = true
embed-resource = "3"

# objc 0.2 的 class!/msg_send! 宏内部含 `cfg(feature = "cargo-clippy")`，
# 宏展开到本 crate 时会触发 unexpected_cfgs 告警；这里声明该值为已知，消除误报。
# 本地 lints：objc 0.2 宏内引用了 `cfg(feature = "cargo_clippy")`，展开到本 crate
# 触发 unexpected_cfgs 误报，需显式声明。因存在本地 [lints.*] 段无法再继承
# workspace lints，故把 workspace 的策略（unsafe_code=warn、clippy all=deny）
# 在此手动复制——改动 workspace lints 时记得同步这里。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
unsafe_code = "warn"

[lints.clippy]
all = "deny"

[dev-dependencies]
# `test-support` 打开 GPUI 的 headless 测试通道（TestAppContext / debug_bounds）：
# 不依赖真实窗口即可验证布局，见 tests/layout.rs。
gpui-kit = { workspace = true, features = ["test-support"] }
