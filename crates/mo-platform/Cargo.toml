[package]
name = "mo-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

# macOS：走 AppKit 的 NSWorkspace（回收站 / 在访达中显示 / 推出卷宗）。
# 只在 macOS 上引：其它平台这个 crate 只给 `Unsupported`。
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
dispatch = "0.2"
# 卷宗列表要读 `f_fstypename`（区分本地盘与网络盘）。
libc.workspace = true

# Windows：Win32 Shell（回收站 IFileOperation / 在资源管理器中显示 / 系统图标）、
# Storage+Ioctl+DeviceAndDriverInstallation（卷宗枚举与「安全删除硬件」式的推出）、
# Graphics_Gdi+WindowsAndMessaging（把 HICON 画进位图取像素）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Devices_DeviceAndDriverInstallation",
] }

[lints]
workspace = true
