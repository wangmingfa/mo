[package]
name = "mo-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mo-core.workspace = true
# 挂载点放在应用数据目录下（SMB / NFS 走系统挂载，见 `mount` 模块）。
dirs.workspace = true
mo-fs.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true

# FTP / FTPS 客户端（Rust 实现，无本机依赖）。
# TLS 用 rustls + aws-lc-rs（与 SFTP 的 russh 同族，不新增本机构建负担；
# 刻意避开 OpenSSL / native-tls），证书校验走系统信任库。
suppaftp.workspace = true
rustls-platform-verifier.workspace = true
# 证书钉选算叶子证书的 SHA-256（自签名 FTPS 的「信任此主机」，见 ftp.rs）。
sha2.workspace = true

# SFTP 后端：纯 Rust SSH（russh），默认 aws-lc-rs 加密后端，无本机系统依赖。
russh.workspace = true
russh-sftp.workspace = true

# WebDAV 后端：基于 reqwest 的异步 PROPFIND/PUT/MKCOL/DELETE/MOVE 客户端（纯 Rust）。
reqwest_dav.workspace = true
# PROPFIND 回的是百分号编码的 href，还原真实文件名要用它。
percent-encoding.workspace = true

[lints]
workspace = true
